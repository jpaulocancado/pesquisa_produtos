name: Atualizar estoque do Bling

on:
  schedule:
    # A cada 30 min, de 7h às 19h30 (horário de Brasília = UTC-3), segunda a sábado
    - cron: "*/30 10-22 * * 1-6"
  workflow_dispatch: {}

concurrency:
  group: bling-token
  cancel-in-progress: false

jobs:
  estoque:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r scripts/requirements.txt
      - run: python scripts/atualizar_estoque.py
        env:
          BLING_CLIENT_ID: ${{ secrets.BLING_CLIENT_ID }}
          BLING_CLIENT_SECRET: ${{ secrets.BLING_CLIENT_SECRET }}
          BLING_REFRESH_TOKEN_INICIAL: ${{ secrets.BLING_REFRESH_TOKEN_INICIAL }}
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
